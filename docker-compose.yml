services:
  postgres:
    image: postgres:16-alpine
    container_name: residencial-pass-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${DB_USER:-residencial}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-residencial}
      POSTGRES_DB: ${DB_NAME:-residencial_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
